<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - The Master Barber Admin</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;family=Noto+Serif:wght@600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#d4af37",
                        "secondary-container": "#474746",
                        "on-surface-variant": "#d0c5af",
                        "on-secondary": "#313030",
                        "outline": "#99907c",
                        "on-secondary-fixed": "#1c1b1b",
                        "surface-dim": "#121414",
                        "primary": "#f2ca50",
                        "on-primary-fixed": "#241a00",
                        "secondary-fixed-dim": "#c8c6c5",
                        "on-tertiary": "#313030",
                        "surface-tint": "#e9c349",
                        "on-tertiary-container": "#454545",
                        "surface": "#121414",
                        "on-error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#474746",
                        "inverse-surface": "#e2e2e2",
                        "on-secondary-container": "#b7b5b4",
                        "tertiary-fixed": "#e5e2e1",
                        "on-tertiary-fixed-variant": "#474646",
                        "surface-container-high": "#282a2b",
                        "on-surface": "#e2e2e2",
                        "tertiary": "#d0cecd",
                        "surface-bright": "#37393a",
                        "inverse-on-surface": "#2f3131",
                        "outline-variant": "#4d4635",
                        "error-container": "#93000a",
                        "primary-fixed-dim": "#e9c349",
                        "surface-variant": "#333535",
                        "surface-container-lowest": "#0c0f0f",
                        "error": "#ffb4ab",
                        "tertiary-fixed-dim": "#c8c6c5",
                        "surface-container": "#1e2020",
                        "on-primary-fixed-variant": "#574500",
                        "secondary": "#c8c6c5",
                        "primary-fixed": "#ffe088",
                        "secondary-fixed": "#e5e2e1",
                        "tertiary-container": "#b5b2b2",
                        "background": "#121414",
                        "on-error": "#690005",
                        "on-primary-container": "#554300",
                        "on-tertiary-fixed": "#1c1b1b",
                        "inverse-primary": "#735c00",
                        "surface-container-highest": "#333535",
                        "surface-container-low": "#1a1c1c",
                        "on-background": "#e2e2e2",
                        "on-primary": "#3c2f00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-sm": "8px",
                        "margin-desktop": "48px",
                        "stack-md": "16px",
                        "section-gap": "80px",
                        "container-max": "1200px",
                        "stack-lg": "32px",
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "unit": "8px"
                    },
                    "fontFamily": {
                        "label-caps": ["Manrope"],
                        "body-md": ["Manrope"],
                        "h3": ["Noto Serif"],
                        "button": ["Manrope"],
                        "h1": ["Noto Serif"],
                        "h2": ["Noto Serif"],
                        "body-lg": ["Manrope"]
                    },
                    "fontSize": {
                        "label-caps": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400" }],
                        "h3": ["24px", { "lineHeight": "1.4", "letterSpacing": "0em", "fontWeight": "600" }],
                        "button": ["14px", { "lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "h1": ["48px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "h2": ["36px", { "lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "letterSpacing": "0.01em", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .custom-glow {
            box-shadow: 0 0 20px -5px rgba(212, 175, 55, 0.15);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-[url('https://images.unsplash.com/photo-1585747860715-2ba37e788b70?ixlib=rb-4.0.3&amp;auto=format&amp;fit=crop&amp;w=2074&amp;q=80')] bg-cover bg-center bg-no-repeat relative" data-alt="A moody, high-contrast, black and white close-up of vintage barber tools resting on dark leather. The lighting is cinematic, highlighting the texture of the steel and leather, evoking a high-end, exclusive atmosphere consistent with a dark-mode luxury aesthetic.">
<!-- Overlay for background image -->
<div class="absolute inset-0 bg-background/90 z-0"></div>
<main class="w-full max-w-md relative z-10">
<!-- Logo Section -->
<div class="text-center mb-stack-lg">
<h1 class="font-h1 text-h1 text-primary-container mb-stack-sm tracking-tighter uppercase">BARBER ADMIN</h1>
<p class="font-label-caps text-label-caps text-on-surface-variant tracking-widest uppercase">Precision Master Barber</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container border border-surface-container-highest rounded-none p-gutter custom-glow">
<div class="mb-stack-lg text-center">
<h2 class="font-h2 text-h2 text-on-surface mb-stack-sm">Sign In</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Access your dashboard</p>
</div>
<form action="#" class="space-y-stack-md" method="POST">
<!-- Username Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-unit uppercase" for="username">Username</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">person</span>
</span>
<input class="block w-full pl-10 pr-3 py-3 bg-background border border-surface-container-highest text-on-surface font-body-md text-body-md rounded-none focus:outline-none focus:border-primary focus:ring-0 transition-colors duration-200 placeholder-on-surface-variant/50" id="username" name="username" placeholder="Enter your username" type="text"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-caps text-label-caps text-on-surface mb-unit uppercase" for="password">Password</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">lock</span>
</span>
<input class="block w-full pl-10 pr-3 py-3 bg-background border border-surface-container-highest text-on-surface font-body-md text-body-md rounded-none focus:outline-none focus:border-primary focus:ring-0 transition-colors duration-200 placeholder-on-surface-variant/50" id="password" name="password" placeholder="Enter your password" type="password"/>
</div>
</div>
<!-- Options Row -->
<div class="flex items-center justify-between pt-stack-sm pb-stack-sm">
<div class="flex items-center">
<input class="h-4 w-4 bg-background border-surface-container-highest text-primary focus:ring-primary focus:ring-offset-background rounded-none cursor-pointer" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-md text-body-md text-on-surface-variant text-sm cursor-pointer" for="remember-me">
                            Remember me
                        </label>
</div>
<div class="text-sm">
<a class="font-button text-button text-primary hover:text-surface-tint transition-colors duration-200" href="#">
                            Forgot Password?
                        </a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-none shadow-sm font-button text-button text-on-primary bg-primary hover:bg-surface-tint focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary focus:ring-offset-background transition-colors duration-200" type="submit">
<span class="material-symbols-outlined mr-2 text-[18px]" style="font-variation-settings: 'FILL' 1;">login</span>
                    LOGIN
                </button>
</form>
<div class="mt-stack-lg pt-stack-md border-t border-surface-container-highest text-center">
<p class="font-label-caps text-label-caps text-on-surface-variant text-[10px] tracking-widest uppercase opacity-60">SECURE ADMIN PORTAL</p>
</div>
</div>
</main>
</body></html>
